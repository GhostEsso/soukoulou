# Production sur un serveur à soi (VPS, Coolify…) : tout tourne sur une machine.
# Seul le service web (port 3000) est exposé, derrière le proxy HTTPS ; API, base et MinIO restent internes.
# Sans Coolify : docker compose -f docker-compose.prod.yml --env-file prod.env up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: soukoulou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: soukoulou
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "soukoulou"]
      interval: 5s
      retries: 10

  minio:
    build: ./docker/minio
    image: soukoulou-minio:2025-04-22
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: soukoulou
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?}
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://soukoulou:${POSTGRES_PASSWORD}@db:5432/soukoulou
      JWT_SECRET: ${JWT_SECRET:?}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?}
      WEB_URL: https://${DOMAIN:?}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: soukoulou
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: soukoulou
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:4000
    expose:
      - "3000"

volumes:
  db-data:
  minio-data:
