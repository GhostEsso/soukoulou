# API sur Render (offre gratuite) — Dashboard Render → New → Blueprint → ce dépôt.
# Les valeurs « sync: false » sont demandées à la création (voir README, section Déploiement).
services:
  - type: web
    name: soukoulou-api
    runtime: docker
    plan: free
    region: frankfurt # à côté de Neon (eu-central-1)
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon : valeur de DATABASE_URL_UNPOOLED (connexion directe)
        sync: false
      - key: WEB_URL # https://<projet>.vercel.app
        sync: false
      - key: API_SECRET # même valeur que sur Vercel et dans GitHub
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      # SasPay (paiement en ligne des frais) : clé et secret du webhook depuis app.saspay.me.
      # Sans SASPAY_API_URL, l'API appelle le bac à sable ; en réel : https://api.saspay.me/api/v1
      - key: SASPAY_API_KEY
        sync: false
      - key: SASPAY_WEBHOOK_SECRET
        sync: false
      - key: SASPAY_API_URL
        sync: false
      # Neon Object Storage : valeurs posées par `neon deploy` dans .env.local
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        value: soukoulou
